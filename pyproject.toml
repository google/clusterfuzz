[project]
name = "clusterfuzz"
version = "0.1.0"
description = "ClusterFuzz"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Root project environment dependencies (from ./Pipfile)
    "crcmod==1.7",
    "cryptography==37.0.4",
    "future==0.17.1",
    "google-cloud-ndb==2.3.4",
    "protobuf==4.23.4",
    "psutil==5.9.4",
    "setuptools==80.9.0",
]

[dependency-groups]
dev = [
    # Development, testing, and linting tools (from ./Pipfile)
    "Fabric==1.14.1",
    "grpcio-tools==1.62.2",
    "gunicorn",
    "isort~=5.13.2",
    "mypy-protobuf==3.4.0",
    "nodeenv==1.9.1",
    "parameterized==0.9.0",
    "paramiko==2.6.0",
    "pyfakefs==4.4.0",
    "pylint~=2.17.7",
    "pylint-protobuf==0.21.0",
    "pyright==1.1.393",
    "pyyaml==6.0.2",
    "selenium==3.141.0",
    "twine",
    "WebTest==3.0.0",
    "yapf==0.22.0",
]

