{% extends "layout-with-toolbar.html" %}
{% block import_element %}
  {% raw %}
    <script src="/private/bower_components/webcomponentsjs/webcomponents-lite.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.2.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.2.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/ui/6.0.0/firebase-ui-auth.js"></script>
    <link type="text/css" rel="stylesheet" href="https://www.gstatic.com/firebasejs/ui/6.0.0/firebase-ui-auth.css" />
    <link rel="import" href="/private/bower_components/polymer/polymer.html">
    <link rel="import" href="/private/bower_components/iron-icons/iron-icons.html">
    <link rel="import" href="/private/bower_components/iron-icon/iron-icon.html">
    <link rel="import" href="/private/bower_components/paper-icon-button/paper-icon-button.html">
    <link rel="import" href="/private/bower_components/paper-item/paper-item.html">
    <link rel="import" href="/private/bower_components/paper-listbox/paper-listbox.html">
    <link rel="import" href="/private/bower_components/app-layout/app-layout.html">

    <link rel="import" href="/private/components/technology/technology.html">
    <link rel="stylesheet" type="text/css" href="/private/stylesheets/main.css">
  {% endraw %}
{% endblock %}
{% block page_title %}
  Log in
{% endblock %}
{% block toolbar_title %}
  Log in
{% endblock %}
{% block main_content %}
  <script>
    // Initialize Firebase
    var config = {
      apiKey: '{{apiKey}}',
      authDomain: '{{authDomain}}',
    };
    firebase.initializeApp(config);

    // Sends a Firebase verification email, asking Firebase to send the user
    // back to this login page once they click the verification link.
    //
    // The continue URL only works if the current domain is listed in the
    // Firebase project's authorized domains, which is not guaranteed for
    // deployments serving on a custom domain. Fall back to a plain
    // verification email in that case, so that email verification never
    // becomes impossible because of a misconfigured continue URL.
    function sendVerificationEmail(user) {
      return user.sendEmailVerification({url: window.location.href}).catch(
          function(error) {
            var continueUrlErrors = [
              'auth/invalid-continue-uri',
              'auth/missing-continue-uri',
              'auth/unauthorized-continue-uri',
            ];
            if (continueUrlErrors.indexOf(error.code) === -1) {
              throw error;
            }

            return user.sendEmailVerification();
          });
    }

    var uiConfig = {
      signInOptions: [
          {
              provider: firebase.auth.GoogleAuthProvider.PROVIDER_ID,
              customParameters: {
                // Forces account selection even when one account
                // is available.
                prompt: 'select_account',
              },
          },
          {
              provider: firebase.auth.GithubAuthProvider.PROVIDER_ID,
              scopes: [
                'user:email',
              ]
          },
      ],
      callbacks: {
        signInSuccessWithAuthResult: function(authResult, redirectUrl) {
          if (!authResult.user.emailVerified) {
            var email = authResult.user.email;
            sendVerificationEmail(authResult.user).then(function() {
              alert(
                  'A verification email has been sent to ' + email +
                  '. Please click the verification link in that email and sign in again.'
              );
            }).catch(function (error) {
              alert(
                  'Your email' + (email ? ' (' + email + ')' : '') +
                  ' is not verified, and we could not send a verification' +
                  ' email: ' + (error.code || error.message) +
                  '. Please try again later.'
              );
            }).then(function() {
              return firebase.auth().signOut();
            });
            return false;
          }

          authResult.user.getIdToken().then(function(idToken) {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', '/session-login');
            xhr.setRequestHeader('content-type', 'application/json');

            xhr.onreadystatechange = function() {
              if (this.readyState == XMLHttpRequest.DONE && this.status == 200) {
                window.location.assign(JSON.parse(atob('{{dest|json}}')));
              }
            }

            xhr.send(JSON.stringify({
              idToken: idToken,
            }));
          });

          return false;
        },
      },
    };

    var ui = new firebaseui.auth.AuthUI(firebase.auth());
    ui.start('#login-container', uiConfig);
  </script>
  <div id="login-container">
  </div>
{% endblock %}
